# 3チャンネル混色応答計測（2026-08-12）用。
# config.iso200_hdr_isoscan_d65_20260807.toml の複製（撮影条件・ROI・幾何は同一）。
# 設計書: docs/superpowers/specs/2026-08-12-color-grid-response-design.md
# 使用スクリプト: examples/python/measure_color_grid_response.py
# 出力先はスクリプトの --output-dir（data/color_grid_response_20260812）で指定し、
# [paths] の calibration 系ディレクトリは本計測では使わない。

[projector]
gamma = 2.2
width = 1920
height = 1080
pos_x = 3440
pos_y = 0
refresh_rate = 60.0
active_x = 607
active_y = 209
active_width = 794
active_height = 794

[camera]
backend = "canon_edsdk"
av = "14"
tv = "1/15"
iso = "200"
image_quality = "LR"
device_index = 0
wait_key_ms = 300
trigger_wait_key_ms = 300
hdr_enabled = true
edsdk_dll_dir = "C:/py_scripts/edsdk-python/dependencies/EDSDK_64/Dll"
half_size = false

[paths]
c2p_map = ""
p2c_map = "data/graycode_recalibration_20260807_iso200_fullframe_isoscan_d65/p2c_dense_active_1920x1080.npy"
warp_method = "p2c"
target_image_space = "projector"
rpcc_matrix = ""
target_image_dir = "data/comp_test_targets_square"
linear_pattern_dir = "data/iso200_hdr_isoscan_d65_20260807/calibration/linear_patterns"
inv_gamma_pattern_dir = "data/iso200_hdr_isoscan_d65_20260807/calibration/projected_patterns"
captured_image_dir = "data/iso200_hdr_isoscan_d65_20260807/calibration/captures"
compensation_image_dir = "data/iso200_hdr_isoscan_d65_20260807/calibration/compensation_linear"
inv_gamma_comp_dir = "data/iso200_hdr_isoscan_d65_20260807/calibration/compensation_projector"

[compensation]
num_divisions = 4
safety_margin = 0.5
min_batch_size = 256
use_gpu = true

[inverse_lut]
num_levels = 17
source = "channel_ramp"
lut_resolution = 256
roi_x = 4520
roi_y = 1600
roi_width = 480
roi_height = 400
trust_low = 10
trust_high = 245
hdr_enabled = true
hdr_max_stops = 3
inverse_lut_path = "data/iso200_hdr_isoscan_d65_20260807/inverse_lut_channel/inverse_lut.npz"
