# Yoshida-Compensation Project Configuration

[projector]
gamma = 2.2
width = 1920
height = 1080
pos_x = 3440            # Win32 \\.\DISPLAY4（物理・論理とも1920x1080、100%）
pos_y = 0               # プロジェクタウィンドウの Y 位置
refresh_rate = 60.0     # リフレッシュレート(Hz)。露光をこの周期の整数倍へスナップ(フリッカー防止)。0で無効

active_x = 613          # 直前の1920x1080色補償実験と同じ投影領域
active_y = 201
active_width = 722
active_height = 722

[camera]
backend = "canon_edsdk" # "canon_edsdk" | "opencv"
av = "14"               # ISOだけを一段上げ、Avは維持
tv = "1/15"             # 60Hzの4周期を積分するフリッカーフリー露光
iso = "400"             # ISO200から一段（1 stop）上げた現行設定
image_quality = "LR"
device_index = 0        # OpenCV backend 使用時のカメラインデックス
wait_key_ms = 300       # バッチ初回、および非トリガ撮影の表示待機 (ms)
trigger_wait_key_ms = 300 # Canonトリガバッチ内の2枚目以降。表示更新完了を安全側で保証
hdr_enabled = true # GrayCode以外の投影パターン撮影を露光ブラケットHDR化
edsdk_dll_dir = "C:/py_scripts/edsdk-python/dependencies/EDSDK_64/Dll"
half_size = false       # 必ずfalse。半解像度RAWはバックエンドでも拒否する

[paths]
c2p_map = ""                                                # 現セットアップはP2Cを使用
p2c_map = "data/graycode_recalibration_20260730/p2c_dense_active_1920x1080.npy"
warp_method = "p2c"     # "c2p" | "p2c"
target_image_space = "projector"  # "camera" | "projector"
rpcc_matrix = ""        # RPCC matrix (.npy)
target_image_dir = "data/comp_test_targets_square"
linear_pattern_dir = "data/full_recalibration_20260730_iso400/calibration/linear_patterns"
inv_gamma_pattern_dir = "data/full_recalibration_20260730_iso400/calibration/projected_patterns"
captured_image_dir = "data/full_recalibration_20260730_iso400/calibration/captures"
compensation_image_dir = "data/full_recalibration_20260730_iso400/calibration/compensation_linear"
inv_gamma_comp_dir = "data/full_recalibration_20260730_iso400/calibration/compensation_projector"

[compensation]
num_divisions = 4               # RGB各4段階、合計64色で実機校正済み
safety_margin = 0.5             # バッチサイズ推定時の安全マージン
min_batch_size = 256            # 最小バッチサイズ
use_gpu = true                 # 色混合行列計算で GPU を使用するか

[inverse_lut]
num_levels = 17                 # 各ランプ（グレー / 単独チャンネル）の階調数
source = "channel_ramp"         # "channel_ramp" | "gray"（一方のみ使用・混在不可）
lut_resolution = 256            # 密な [0,1] 逆LUT のエントリ数
roi_x = 4520                    # 右側の均一な白色面（フル解像度）
roi_y = 1600
roi_width = 480
roi_height = 400
trust_low = 10                  # 信頼下限（8bit画素値, ≤は非信頼/黒潰れ）
trust_high = 245                # 信頼上限（8bit画素値, ≥は非信頼/サチュ）
hdr_enabled = true              # 簡易HDRブラケット撮影
hdr_max_stops = 3               # 各方向の最大露光段数
inverse_lut_path = "data/full_recalibration_20260730_iso400/inverse_lut/inverse_lut.npz"
