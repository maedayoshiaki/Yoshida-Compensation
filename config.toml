# Yoshida-Compensation Project Configuration

[projector]
gamma = 2.2
width = 1920
height = 1080
pos_x = 1920            # プロジェクタウィンドウの X 位置 (DISPLAY2 の左端)
pos_y = 0               # プロジェクタウィンドウの Y 位置
refresh_rate = 60.0     # リフレッシュレート(Hz)。露光をこの周期の整数倍へスナップ(フリッカー防止)。0で無効

[camera]
backend = "canon_edsdk" # "canon_edsdk" | "opencv"
av = "5"
tv = "1/60"             # 60Hzの整数倍(フリッカーフリー)。最速の同期露光。白飛びするなら av を上げる
iso = "200"
image_quality = "LR"
device_index = 0        # OpenCV backend 使用時のカメラインデックス
wait_key_ms = 300       # パターン表示後の待機時間 (ms)

[paths]
c2p_map = "result_c2p_compensated_delaunay.npy"            # C2P correspondence map (.npy)
p2c_map = "result_p2c_compensated_delaunay.npy"            # P2C correspondence map (.npy)
warp_method = "p2c"     # "c2p" | "p2c"
target_image_space = "camera"  # "camera" | "projector"
rpcc_matrix = ""        # RPCC matrix (.npy)
target_image_dir = "data/target_images"
linear_pattern_dir = "data/linear_proj_patterns"
inv_gamma_pattern_dir = "data/inv_gamma_proj_patterns"
captured_image_dir = "data/captured_images"
compensation_image_dir = "data/compensation_images"
inv_gamma_comp_dir = "data/inv_gamma_comp_images"

[compensation]
num_divisions = 3               # パターン生成の分割数
safety_margin = 0.5             # バッチサイズ推定時の安全マージン
min_batch_size = 256            # 最小バッチサイズ
use_gpu = true                 # 色混合行列計算で GPU を使用するか

[inverse_lut]
num_levels = 17                 # 各ランプ（グレー / 単独チャンネル）の階調数
source = "channel_ramp"         # "channel_ramp" | "gray"（一方のみ使用・混在不可）
lut_resolution = 256            # 密な [0,1] 逆LUT のエントリ数
roi_x = 4312                    # 計測 ROI 左端 x（ピクセル, 投影領域の内側）
roi_y = 995                     # 計測 ROI 上端 y（ピクセル, 投影領域の内側）
roi_width = 1775                # 計測 ROI 幅（0 なら全フレーム平均）
roi_height = 1513               # 計測 ROI 高さ（0 なら全フレーム平均）
trust_low = 10                  # 信頼下限（8bit画素値, ≤は非信頼/黒潰れ）
trust_high = 245                # 信頼上限（8bit画素値, ≥は非信頼/サチュ）
hdr_enabled = true              # 簡易HDRブラケット撮影
hdr_max_stops = 3               # 各方向の最大露光段数
inverse_lut_path = "data/inverse_lut.npz"
