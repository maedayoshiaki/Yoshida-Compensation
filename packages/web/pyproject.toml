[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoshidacomp-web"
version = "0.1.0"
description = "Web viewer for projector-camera color mixing matrices"
requires-python = ">=3.13"
dependencies = [
    "yoshidacomp",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # yoshidacomp_web/matrix.py imports numpy directly; it has resolved so far
    # only because yoshidacomp pulls numpy into the same venv.
    "numpy>=2.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["yoshidacomp_web*"]

[tool.setuptools.package-data]
yoshidacomp_web = ["static/*", "static/js/*"]
