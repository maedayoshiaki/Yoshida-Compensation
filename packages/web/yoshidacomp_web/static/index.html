<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>色変換行列ビューア</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">色変換行列ビューア</div>
    <input id="path-input" class="mono path" type="text" spellcheck="false"
           value="data/linear_pipeline_1080/matrices_linear_gamma.npy"
           placeholder="行列 .npy のパス (H, W, 4, 3)" />
    <button id="btn-browse-matrix">参照</button>
    <button id="btn-load" class="primary">読み込み</button>
    <div class="spacer"></div>
    <div id="meta-info" class="muted mono">行列未読み込み</div>
  </header>

  <div id="space-note" class="note" hidden></div>

  <main>
    <section class="tilepane">
      <div id="tile-grid" class="tile-grid"></div>
      <div class="hint mono">
        ドラッグ=パン ・ ホイール=ズーム ・ クリック=読み取り固定/解除 ・ 12枚は連動
      </div>
    </section>

    <aside class="sidebar">
      <div class="group">
        <label class="lbl">ビュー</label>
        <select id="view-select"></select>
      </div>

      <!-- The class legend for a `categorical` view, and deliberately empty.

           Both the colours and the labels are written by js/main.js's
           renderClassLegend: the swatches from CLASS_COLORS (the array the
           fragment shader's palette is generated from) and the text from
           `payload.labels`. Writing the four Japanese class names here instead
           would be the second source of truth for a mapping the server owns --
           views/gamut.py says in as many words that the *order* of its LABELS
           is the class index and is part of the wire contract -- so a
           relabelling or a reordering on that side would leave this page
           explaining the previous meaning of the same four colours, with
           nothing failing anywhere.

           Directly under the view picker, not down with the two standing
           legends at the foot of this column. Those describe things that are
           true of every view and can be read once; this one is the key to the
           picture currently on screen, and without it the tiles are four
           unexplained colours. The sidebar is `overflow-y: auto`, and measured
           on a 1600x1000 window with a target and a LUT loaded, the foot of it
           is off the bottom -- the same way the display range and the timings
           used to be, for the same reason, before they moved into the readout
           strip. Hidden until a categorical view renders, so for every other
           view this costs the column nothing.

           `categorical` ビュー用のクラス凡例。中身は空で、色もラベルも
           js/main.js が書く（色は CLASS_COLORS、文字は `payload.labels`）。
           和文のラベルをここに書くと、サーバが持っている対応関係の写しが
           できてしまう。views/gamut.py の LABELS は並び自体がクラス番号で
           あり、ワイヤ契約の一部である。
           下端の凡例2つと並べずビュー選択の直下に置くのは、あちらが全ビュー
           共通で一度読めば済むのに対し、これは今出ている絵を読むための鍵だから
           である。サイドバーは `overflow-y: auto` で、1600x1000 の窓で
           ターゲットとLUTを読み込むと下端は画面外にある（表示レンジと計測を
           読み取り欄へ移した理由と同じ）。 -->
      <div id="class-legend" class="group class-legend" hidden></div>

      <hr />

      <div class="group">
        <label class="lbl">露出 <span id="ev-val" class="mono">0.0</span> EV</label>
        <input id="ev-slider" type="range" min="-6" max="6" step="0.1" value="0" />
      </div>
      <div class="group">
        <label class="lbl" for="gamma-input">γ</label>
        <input id="gamma-input" class="mono num" type="number"
               min="0.01" max="10" step="0.01" value="1" />
        <input id="gamma-slider" type="range" min="0.2" max="3" step="0.01" value="1" />
      </div>
      <div class="group">
        <label class="lbl">カラーマップ</label>
        <select id="cmap-select">
          <option value="0">発散（青−白−赤）</option>
          <option value="1">グレースケール</option>
        </select>
      </div>
      <div class="group inline">
        <label><input id="dither-check" type="checkbox" checked /> ディザ</label>
        <button id="btn-reset-view">表示リセット</button>
      </div>

      <hr />

      <!-- The two loaders the `compensation` view cannot be driven without.

           Its ターゲットID / LUT ID are free text (a stored id only exists at
           runtime, see views/base.py::ParamSpec.type), so before these existed
           the only way to obtain one was to POST /api/target by hand: the view
           shipped complete and unreachable from a browser. They load a path and
           write the id they get back into the parameter box themselves -- the
           id is never something the user has to copy.

           In the sidebar rather than the toolbar because that row already holds
           the matrix path box at 520px and these two are the same shape; three
           of them side by side is a toolbar that wraps at any window this
           viewer is used at.

           `compensation` ビューを駆動するのに必要な2つの読み込み欄。
           ターゲットID / LUT ID は実行時にしか存在しないidを指す自由入力で
           あり、これが無い間は curl で POST /api/target するほかに手が無く、
           ビューは「完成しているがブラウザから到達できない」状態だった。
           読み込むと返ってきたidを自分でパラメータ欄へ書き込む（利用者に
           コピーさせない）。ツールバーではなくサイドバーに置くのは、あちらが
           既に520pxの行列パス欄を持っており、同じ形の欄が3つ並ぶと通常の
           窓幅で折り返すためである。

           Both boxes start empty. They shipped pre-filled with
           `data/comp_test_targets_square` and
           `data/full_recalibration_20260730_iso400/inverse_lut/inverse_lut.npz`
           -- two directories that exist on the machine this was written on and
           in no other checkout, since `data/` is not under version control. On
           anyone else's clone the first click on either button was a 404 about
           a path they never typed. The placeholders say what kind of thing goes
           in each box, which is the part that generalises; a path that names one
           person's captures does not.

           (`path-input` in the toolbar has the same property and is deliberately
           left as it is: it predates this branch and is not part of its diff.
           Do not "restore consistency" by putting machine paths back here.)

           2つの欄は空で始まる。以前は上記2つの実パスが入っていたが、`data/` は
           git 管理外なので他のチェックアウトには存在せず、初回クリックが
           「打っていないパス」の404になっていた。プレースホルダは「何を入れる
           欄か」を述べており、そちらが一般化する部分である。
           （ツールバーの `path-input` も同じ性質を持つが、本ブランチ以前から
           あるものなので触っていない。ここへ実パスを戻して「揃える」ことは
           しないこと。） -->
      <div class="group">
        <label class="lbl" for="target-path">ターゲット画像</label>
        <input id="target-path" class="mono loader" type="text" spellcheck="false"
               placeholder="画像ファイル または画像を並べたディレクトリ" />
        <div class="group inline">
          <button id="btn-browse-target">参照</button>
          <button id="btn-load-target">読み込み</button>
          <span id="target-info" class="muted mono">未読み込み</span>
        </div>
        <!-- Only shown for a directory; see main.js::showTargetImages. -->
        <select id="target-images" hidden></select>
      </div>

      <div class="group">
        <label class="lbl" for="lut-path">逆LUT (.npz)</label>
        <input id="lut-path" class="mono loader" type="text" spellcheck="false"
               placeholder="inverse_lut.npz のパス" />
        <div class="group inline">
          <button id="btn-browse-lut">参照</button>
          <button id="btn-load-lut">読み込み</button>
          <span id="lut-info" class="muted mono">未読み込み</span>
        </div>
        <canvas id="lut-curve" class="lut-curve"></canvas>
        <label class="lut-legend">
          <input id="lut-gamma-overlay" type="checkbox" checked />
          <span class="muted">解析ガンマ <span id="lut-gamma-value" class="mono">—</span> を重ねる</span>
        </label>
      </div>

      <hr />

      <div class="group">
        <label class="lbl">サーバ側パラメータ <span class="muted">（適用で再取得）</span></label>
        <div id="server-params"></div>
      </div>

      <hr />

      <!-- The only control on this page that writes to the user's disk.

           Placed directly under the server-parameter group, and that is the
           argument for its position rather than a matter of taste: what it
           sends *is* that group. `POST /api/generate` takes the ids and the
           settings the picture above was rendered with, so the group it reads
           and the button that reads it belong in the same column, in that
           order. Up in the toolbar, beside 読み込み, it would be a save button
           whose inputs are three hundred pixels away and a scroll down.

           Nothing here holds a default path. `output_dir` is resolved by the
           *server*, against its working directory, so a pre-filled relative
           path would name a place on the machine the server runs on that the
           person typing has no reason to have looked at -- and the one thing
           this endpoint must never do is write somewhere the user did not
           name. (`path-input` in the toolbar is pre-filled and stays that way;
           reading a matrix is not writing a file. See the note on the two
           loader boxes above.)

           The 上書き block below is `hidden` until a 409 says the directory is
           not empty, and that is the whole of the overwrite affordance: there
           is no checkbox, because a checkbox is set once and then applies to
           every press afterwards. `generate.py` refuses a non-empty directory
           and writes *nothing* -- a mistyped path in this repository can name
           99 GB of captures that cost hardware, a subject and a day to
           reproduce -- and that refusal only holds if answering it stays an
           act rather than a setting.

           このページで唯一ディスクへ書くコントロール。サーバ側パラメータ群の
           直下に置くのは好みではなく、送るものがその群そのものだからである
           （上の絵が描かれたときのIDと設定を送る）。既定のパスは持たせない。
           `output_dir` はサーバの作業ディレクトリ基準で解決されるので、
           既定値を入れると「打っていない場所」を指しうる。上書きの操作は
           409 が出るまで隠れているボタン1つだけで、チェックボックスにはしない
           ——チェックボックスは一度入れれば以後すべての押下に効いてしまう。 -->
      <div class="group">
        <label class="lbl" for="gen-output-dir">投影画像の生成</label>
        <input id="gen-output-dir" class="mono loader" type="text" spellcheck="false"
               placeholder="出力先ディレクトリ（空でなければ確認します）" />
        <div class="group inline">
          <button id="btn-browse-output">参照</button>
          <button id="btn-generate" class="primary">生成</button>
          <span id="gen-info" class="muted mono">未生成</span>
        </div>
        <!-- The paths the server reports back, absolute. Written by
             js/main.js::showGeneratedFiles from the response, never from the
             box above: `write_projection_images` resolves `output_dir` before
             anything else precisely so that what it names is a place the user
             can find, and echoing the typed string back would throw that away
             on every machine where the two differ.
             サーバが返す絶対パスを出す欄。入力欄の文字列を反響させない。 -->
        <div id="gen-files" class="gen-files mono"></div>
        <div id="gen-overwrite" class="gen-overwrite" hidden>
          <div id="gen-overwrite-detail" class="muted"></div>
          <button id="btn-generate-overwrite">上書きして生成</button>
        </div>
      </div>

      <hr />

      <div class="group legend">
        <span class="legend-swatch nan"></span>
        <span class="muted">マスク色 = NaN（有効投影領域の外）</span>
      </div>
      <div class="group legend">
        <span class="legend-swatch grad"></span>
        <span class="muted">負 ← 0 → 正</span>
      </div>
    </aside>
  </main>

  <!-- The file picker, shared by all four path boxes.

       One dialog rather than four, because what differs between the boxes is
       three values (mode, suffix filter, title) and not any behaviour. Four
       copies would be four places to fix the next time a listing gets a column.

       It lives here, outside <main>, because it covers the whole page: nested
       inside the sidebar it would be clipped by that column's `overflow-y:
       auto` and appear as a scrollable sliver.

       Empty on purpose. Every row is written by js/filepicker.js from the
       `GET /api/browse` response -- names, sizes and the truncation notice are
       the server's facts, and a hard-coded row here would be a second source
       for one of them. The same argument as the class legend above.

       4つのパス欄で1つのダイアログを共有する。欄ごとに違うのは3つの値
       （モード・拡張子フィルタ・見出し）だけで、挙動は同じだからである。
       <main> の外に置くのは、サイドバーの中では `overflow-y: auto` に
       切り取られて細長い断片になるため。中身は空で、全行を filepicker.js が
       応答から書く。 -->
  <div id="picker-backdrop" class="picker-backdrop" hidden>
    <div id="picker" class="picker">
      <div class="picker-head">
        <span id="picker-title" class="lbl"></span>
        <select id="picker-roots" class="mono"></select>
        <span id="picker-cwd" class="mono path"></span>
      </div>
      <div class="picker-bar">
        <button id="picker-up">↑ 上へ</button>
        <span id="picker-count" class="muted mono"></span>
        <span id="picker-error" class="mono"></span>
      </div>
      <div id="picker-list" class="picker-list mono"></div>
      <div id="picker-newdir" class="picker-newdir" hidden>
        <label class="lbl" for="picker-newdir-name">新規フォルダ名（任意）</label>
        <input id="picker-newdir-name" class="mono" type="text" spellcheck="false" />
      </div>
      <div class="picker-foot">
        <!-- What 選択 will hand back, exactly. The three modes differ in what a
             press means -- a file in `file`, the current directory in `dir`,
             either in `file_or_dir` -- and this line is how that stops being
             something the user has to infer from the mode they did not choose.
             押したときに返る文字列そのもの。モードによって意味が変わるので、
             推測させずに出す。 -->
        <span id="picker-chosen" class="mono"></span>
        <div class="spacer"></div>
        <button id="picker-cancel">取消</button>
        <button id="picker-choose" class="primary">選択</button>
      </div>
    </div>
  </div>

  <!-- The readout is one row of panels, not a stack.

       Everything here describes the same moment -- the hovered pixel, the range
       the tiles are drawn against, and what the last transfer cost -- so it has
       to be legible at once and without scrolling. The display range and the
       three timings used to live at the bottom of the sidebar, below the
       controls, where the sidebar's own overflow put them off screen on a short
       window; the matrix table used to be stretched across the full width above
       an equally wide list of view values. Both cost the tiles vertical space
       to show whitespace.

       読み取り欄は縦積みではなく1行に並べる。ここに出るものは全て同じ瞬間を
       説明している（ホバー中の画素、タイルの表示レンジ、直前の転送の実測）ので、
       スクロールせずに同時に読めなければ意味がない。表示レンジと計測は以前
       サイドバー下端にあり、窓が低いと画面外だった。行列の表は全幅に伸びていた。
       どちらもタイルの高さを余白のために削っていた。 -->
  <section class="readout">
    <div class="rd-panel">
      <div class="rd-title mono">
        行列 <span id="probe-pos" class="val">—</span>
        <span id="probe-pin" class="muted"></span>
      </div>
      <div id="probe-grid" class="probe-grid mono"></div>
    </div>

    <!-- The second panel of numbers, shown only when the picture is not the
         matrix. Under a view of the coefficients themselves it holds the same
         twelve numbers the table to its left already shows -- measured at 974px
         of a 1600px strip, the widest thing in a bar whose whole purpose is to
         stop wasting width -- so `values_are_matrix` on the view spec takes it
         away entirely, heading included. See reload() in js/main.js.
         2枚目の数値の板。描かれているものが行列でないときだけ出す。係数その
         ものを見ているビューでは左の表と同じ12個であり、1600pxの帯のうち
         974pxを占めていた（幅を無駄にしないための帯で最も広い要素だった）。
         ビュー仕様の `values_are_matrix` によって見出しごと消える。 -->
    <div id="view-panel" class="rd-panel grow">
      <div class="rd-title mono">ビュー値 <span id="view-title" class="muted">—</span></div>
      <div id="view-values" class="view-values mono"></div>
    </div>

    <div class="rd-panel">
      <div class="rd-title mono">表示レンジ</div>
      <div class="rd-rows mono">
        <div><span id="range-info" class="val">—</span></div>
      </div>
    </div>

    <div class="rd-panel">
      <div class="rd-title mono">計測</div>
      <!-- In the order the work happens. レンジ came up from the status line,
           which was printing 転送 and GPU転送 again 20px below this panel.
           作業の順。レンジはステータス行から移した（同じ行がこの板の20px下で
           転送とGPU転送を繰り返していた）。 -->
      <div class="rd-rows mono">
        <div>転送 <span id="perf-fetch" class="val">—</span></div>
        <div>レンジ <span id="perf-ranges" class="val">—</span></div>
        <div>GPU転送 <span id="perf-upload" class="val">—</span></div>
        <div>JSヒープ <span id="perf-heap" class="val">—</span></div>
      </div>
    </div>
  </section>

  <footer id="status" class="mono">起動中…</footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
