<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>色変換行列ビューア</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">色変換行列ビューア</div>
    <input id="path-input" class="mono path" type="text" spellcheck="false"
           value="data/linear_pipeline_1080/matrices_linear_gamma.npy"
           placeholder="行列 .npy のパス (H, W, 4, 3)" />
    <button id="btn-load" class="primary">読み込み</button>
    <div class="spacer"></div>
    <div id="meta-info" class="muted mono">行列未読み込み</div>
  </header>

  <div id="space-note" class="note" hidden></div>

  <main>
    <section class="tilepane">
      <div id="tile-grid" class="tile-grid"></div>
      <div class="hint mono">
        ドラッグ=パン ・ ホイール=ズーム ・ クリック=読み取り固定/解除 ・ 12枚は連動
      </div>
    </section>

    <aside class="sidebar">
      <div class="group">
        <label class="lbl">ビュー</label>
        <select id="view-select"></select>
      </div>

      <hr />

      <div class="group">
        <label class="lbl">露出 <span id="ev-val" class="mono">0.0</span> EV</label>
        <input id="ev-slider" type="range" min="-6" max="6" step="0.1" value="0" />
      </div>
      <div class="group">
        <label class="lbl" for="gamma-input">γ</label>
        <input id="gamma-input" class="mono num" type="number"
               min="0.01" max="10" step="0.01" value="1" />
        <input id="gamma-slider" type="range" min="0.2" max="3" step="0.01" value="1" />
      </div>
      <div class="group">
        <label class="lbl">カラーマップ</label>
        <select id="cmap-select">
          <option value="0">発散（青−白−赤）</option>
          <option value="1">グレースケール</option>
        </select>
      </div>
      <div class="group inline">
        <label><input id="dither-check" type="checkbox" checked /> ディザ</label>
        <button id="btn-reset-view">表示リセット</button>
      </div>

      <hr />

      <!-- The two loaders the `compensation` view cannot be driven without.

           Its ターゲットID / LUT ID are free text (a stored id only exists at
           runtime, see views/base.py::ParamSpec.type), so before these existed
           the only way to obtain one was to POST /api/target by hand: the view
           shipped complete and unreachable from a browser. They load a path and
           write the id they get back into the parameter box themselves -- the
           id is never something the user has to copy.

           In the sidebar rather than the toolbar because that row already holds
           the matrix path box at 520px and these two are the same shape; three
           of them side by side is a toolbar that wraps at any window this
           viewer is used at.

           `compensation` ビューを駆動するのに必要な2つの読み込み欄。
           ターゲットID / LUT ID は実行時にしか存在しないidを指す自由入力で
           あり、これが無い間は curl で POST /api/target するほかに手が無く、
           ビューは「完成しているがブラウザから到達できない」状態だった。
           読み込むと返ってきたidを自分でパラメータ欄へ書き込む（利用者に
           コピーさせない）。ツールバーではなくサイドバーに置くのは、あちらが
           既に520pxの行列パス欄を持っており、同じ形の欄が3つ並ぶと通常の
           窓幅で折り返すためである。

           Both boxes start empty. They shipped pre-filled with
           `data/comp_test_targets_square` and
           `data/full_recalibration_20260730_iso400/inverse_lut/inverse_lut.npz`
           -- two directories that exist on the machine this was written on and
           in no other checkout, since `data/` is not under version control. On
           anyone else's clone the first click on either button was a 404 about
           a path they never typed. The placeholders say what kind of thing goes
           in each box, which is the part that generalises; a path that names one
           person's captures does not.

           (`path-input` in the toolbar has the same property and is deliberately
           left as it is: it predates this branch and is not part of its diff.
           Do not "restore consistency" by putting machine paths back here.)

           2つの欄は空で始まる。以前は上記2つの実パスが入っていたが、`data/` は
           git 管理外なので他のチェックアウトには存在せず、初回クリックが
           「打っていないパス」の404になっていた。プレースホルダは「何を入れる
           欄か」を述べており、そちらが一般化する部分である。
           （ツールバーの `path-input` も同じ性質を持つが、本ブランチ以前から
           あるものなので触っていない。ここへ実パスを戻して「揃える」ことは
           しないこと。） -->
      <div class="group">
        <label class="lbl" for="target-path">ターゲット画像</label>
        <input id="target-path" class="mono loader" type="text" spellcheck="false"
               placeholder="画像ファイル または画像を並べたディレクトリ" />
        <div class="group inline">
          <button id="btn-load-target">読み込み</button>
          <span id="target-info" class="muted mono">未読み込み</span>
        </div>
        <!-- Only shown for a directory; see main.js::showTargetImages. -->
        <select id="target-images" hidden></select>
      </div>

      <div class="group">
        <label class="lbl" for="lut-path">逆LUT (.npz)</label>
        <input id="lut-path" class="mono loader" type="text" spellcheck="false"
               placeholder="inverse_lut.npz のパス" />
        <div class="group inline">
          <button id="btn-load-lut">読み込み</button>
          <span id="lut-info" class="muted mono">未読み込み</span>
        </div>
        <canvas id="lut-curve" class="lut-curve"></canvas>
        <label class="lut-legend">
          <input id="lut-gamma-overlay" type="checkbox" checked />
          <span class="muted">解析ガンマ <span id="lut-gamma-value" class="mono">—</span> を重ねる</span>
        </label>
      </div>

      <hr />

      <div class="group">
        <label class="lbl">サーバ側パラメータ <span class="muted">（適用で再取得）</span></label>
        <div id="server-params"></div>
      </div>

      <hr />

      <div class="group legend">
        <span class="legend-swatch nan"></span>
        <span class="muted">マスク色 = NaN（有効投影領域の外）</span>
      </div>
      <div class="group legend">
        <span class="legend-swatch grad"></span>
        <span class="muted">負 ← 0 → 正</span>
      </div>
    </aside>
  </main>

  <!-- The readout is one row of panels, not a stack.

       Everything here describes the same moment -- the hovered pixel, the range
       the tiles are drawn against, and what the last transfer cost -- so it has
       to be legible at once and without scrolling. The display range and the
       three timings used to live at the bottom of the sidebar, below the
       controls, where the sidebar's own overflow put them off screen on a short
       window; the matrix table used to be stretched across the full width above
       an equally wide list of view values. Both cost the tiles vertical space
       to show whitespace.

       読み取り欄は縦積みではなく1行に並べる。ここに出るものは全て同じ瞬間を
       説明している（ホバー中の画素、タイルの表示レンジ、直前の転送の実測）ので、
       スクロールせずに同時に読めなければ意味がない。表示レンジと計測は以前
       サイドバー下端にあり、窓が低いと画面外だった。行列の表は全幅に伸びていた。
       どちらもタイルの高さを余白のために削っていた。 -->
  <section class="readout">
    <div class="rd-panel">
      <div class="rd-title mono">
        行列 <span id="probe-pos" class="val">—</span>
        <span id="probe-pin" class="muted"></span>
      </div>
      <div id="probe-grid" class="probe-grid mono"></div>
    </div>

    <!-- The second panel of numbers, shown only when the picture is not the
         matrix. Under a view of the coefficients themselves it holds the same
         twelve numbers the table to its left already shows -- measured at 974px
         of a 1600px strip, the widest thing in a bar whose whole purpose is to
         stop wasting width -- so `values_are_matrix` on the view spec takes it
         away entirely, heading included. See reload() in js/main.js.
         2枚目の数値の板。描かれているものが行列でないときだけ出す。係数その
         ものを見ているビューでは左の表と同じ12個であり、1600pxの帯のうち
         974pxを占めていた（幅を無駄にしないための帯で最も広い要素だった）。
         ビュー仕様の `values_are_matrix` によって見出しごと消える。 -->
    <div id="view-panel" class="rd-panel grow">
      <div class="rd-title mono">ビュー値 <span id="view-title" class="muted">—</span></div>
      <div id="view-values" class="view-values mono"></div>
    </div>

    <div class="rd-panel">
      <div class="rd-title mono">表示レンジ</div>
      <div class="rd-rows mono">
        <div><span id="range-info" class="val">—</span></div>
      </div>
    </div>

    <div class="rd-panel">
      <div class="rd-title mono">計測</div>
      <!-- In the order the work happens. レンジ came up from the status line,
           which was printing 転送 and GPU転送 again 20px below this panel.
           作業の順。レンジはステータス行から移した（同じ行がこの板の20px下で
           転送とGPU転送を繰り返していた）。 -->
      <div class="rd-rows mono">
        <div>転送 <span id="perf-fetch" class="val">—</span></div>
        <div>レンジ <span id="perf-ranges" class="val">—</span></div>
        <div>GPU転送 <span id="perf-upload" class="val">—</span></div>
        <div>JSヒープ <span id="perf-heap" class="val">—</span></div>
      </div>
    </div>
  </section>

  <footer id="status" class="mono">起動中…</footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
