# Display5 test configuration (based on config.toml; projector window moved to DISPLAY5)

[projector]
gamma = 2.2
width = 1280
height = 720
pos_x = 3440            # projector display (user's "display 5") = \\.\DISPLAY4, Bounds=3440,0 1280x720
pos_y = 0
refresh_rate = 60.0

[camera]
backend = "canon_edsdk"
av = "13"               # white unclipped at 1/15: ROI p99.9 ~ (174,98,158) 8bit, sat=0
tv = "1/15"             # 4 refresh cycles: cuts partial-cycle jitter 3.3%->~1.1% vs 1/60
iso = "100"
image_quality = "LR"
device_index = 0
wait_key_ms = 300
half_size = false

[paths]
c2p_map = "result_c2p_compensated_delaunay.npy"
p2c_map = "result_p2c_compensated_delaunay.npy"
warp_method = "p2c"
target_image_space = "camera"
rpcc_matrix = ""
target_image_dir = "data/target_images"
linear_pattern_dir = "data/linear_proj_patterns"
inv_gamma_pattern_dir = "data/inv_gamma_proj_patterns"
captured_image_dir = "data/captured_images"
compensation_image_dir = "data/compensation_images"
inv_gamma_comp_dir = "data/inv_gamma_comp_images"

[compensation]
num_divisions = 3
safety_margin = 0.5
min_batch_size = 256
use_gpu = true

[inverse_lut]
num_levels = 33                 # 2x default (user allows more patterns)
source = "channel_ramp"
lut_resolution = 256
roi_x = 2778                    # derived from white-black difference on the canvas
roi_y = 826
roi_width = 1837
roi_height = 2324
trust_low = 5                   # user-specified; knots with ROI mean below 5/255 are dropped
                                # (10 would drop all G knots below input ~0.35, white G ~75/255)
trust_high = 245
hdr_enabled = true
hdr_max_stops = 3
inverse_lut_path = "data/inverse_lut.npz"
