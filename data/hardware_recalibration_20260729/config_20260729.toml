# Full color-compensation recalibration for the physical setup on 2026-07-29.

[projector]
gamma = 2.2
width = 1920
height = 1080
pos_x = 3440
pos_y = 0
refresh_rate = 60.0
active_x = 613
active_y = 201
active_width = 722
active_height = 722

[camera]
backend = "canon_edsdk"
av = "13"
tv = "1/15"
iso = "100"
image_quality = "LR"
device_index = 0
wait_key_ms = 300
trigger_wait_key_ms = 1
half_size = false

[paths]
c2p_map = ""
p2c_map = "data/hardware_recalibration_20260729/maps/p2c_homography_1920x1080.npy"
warp_method = "p2c"
target_image_space = "projector"
rpcc_matrix = ""
target_image_dir = "data/comp_test_targets_square"
linear_pattern_dir = "data/hardware_recalibration_20260729/color_calibration/linear_patterns"
inv_gamma_pattern_dir = "data/hardware_recalibration_20260729/color_calibration/projected_patterns"
captured_image_dir = "data/hardware_recalibration_20260729/color_calibration/captures"
compensation_image_dir = "data/hardware_recalibration_20260729/results/compensation_linear"
inv_gamma_comp_dir = "data/hardware_recalibration_20260729/results/compensation_projector"

[compensation]
num_divisions = 3
safety_margin = 0.5
min_batch_size = 256
use_gpu = true

[inverse_lut]
num_levels = 17
source = "channel_ramp"
lut_resolution = 256
roi_x = 2600
roi_y = 800
roi_width = 1800
roi_height = 2200
trust_low = 10
trust_high = 245
hdr_enabled = true
hdr_max_stops = 3
inverse_lut_path = "data/hardware_recalibration_20260729/inverse_lut.npz"
