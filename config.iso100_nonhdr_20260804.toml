# ISO100 non-HDR color-compensation run.
# Other capture/projector settings match the current ISO400 setup.

[projector]
gamma = 2.2
width = 1920
height = 1080
# User requested projection window 4: Win32 DISPLAY4.
pos_x = 3440
pos_y = 0
refresh_rate = 60.0
active_x = 613
active_y = 201
active_width = 722
active_height = 722

[camera]
backend = "canon_edsdk"
av = "14"
tv = "1/15"
iso = "100"
image_quality = "LR"
device_index = 0
wait_key_ms = 300
trigger_wait_key_ms = 300
hdr_enabled = false
edsdk_dll_dir = "C:/py_scripts/edsdk-python/dependencies/EDSDK_64/Dll"
half_size = false

[paths]
c2p_map = ""
p2c_map = "data/graycode_recalibration_20260805_iso100/p2c_dense_active_1920x1080.npy"
warp_method = "p2c"
target_image_space = "projector"
rpcc_matrix = ""
target_image_dir = "data/comp_test_targets_square"
linear_pattern_dir = "data/iso100_nonhdr_20260804/calibration/linear_patterns"
inv_gamma_pattern_dir = "data/iso100_nonhdr_20260804/calibration/projected_patterns"
captured_image_dir = "data/iso100_nonhdr_20260804/calibration/captures"
compensation_image_dir = "data/iso100_nonhdr_20260804/calibration/compensation_linear"
inv_gamma_comp_dir = "data/iso100_nonhdr_20260804/calibration/compensation_projector"

[compensation]
num_divisions = 4
safety_margin = 0.5
min_batch_size = 256
use_gpu = true

[inverse_lut]
num_levels = 17
source = "channel_ramp"
lut_resolution = 256
roi_x = 4520
roi_y = 1600
roi_width = 480
roi_height = 400
trust_low = 10
trust_high = 245
hdr_enabled = false
hdr_max_stops = 3
inverse_lut_path = "data/iso100_nonhdr_20260804/inverse_lut_channel/inverse_lut.npz"
